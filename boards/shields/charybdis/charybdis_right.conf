CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_EXT_POWER=y

# ── badjeff PMW3610 driver ────────────────────────────────────────────────
# Replaces all CONFIG_PMW3610_INO_* from the Ziembski driver.
# CPI, orientation, and invert are now DT node attributes in the overlay,
# not Kconfig symbols — so there is nothing more to set here for those.
CONFIG_PMW3610_ALT=y

# Optional: add 1s power-up delay if you see "Incorrect product id 0xFF"
# in logs on nice_nano_v2 (external power needs time to stabilise).
# CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000

# Optional: reduce report interval (ms) for higher effective poll rate.
# Default is 12ms (~83Hz). Lower values increase BLE traffic.
# CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=8

# ── BLE & heap sizing ─────────────────────────────────────────────────────
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=32768

# INPUT_THREAD_STACK_SIZE: Zephyr defaults to 1024 bytes which is not enough
# for the call chain: input_handler -> volume processor -> zmk_behavior_invoke_binding
# -> raise_zmk_keycode_state_changed -> event_manager -> all HID subscribers.
# 2048 gives enough headroom for this path on the central side.
CONFIG_INPUT_THREAD_STACK_SIZE=2048


# ── Core ──────────────────────────────────────────────────────────────────────
CONFIG_ZMK_BLE_ADV=y

# ── Caps Lock reporting (bit 3 of status_flags) ───────────────────────────────
# Requires ZMK to track HID indicator state. Without this, bit 3 is always 0.
CONFIG_ZMK_HID_INDICATORS=y

# ── Preferred output reporting (bit 5 of status_flags) ────────────────────────
# Already enabled on most keyboards that have a USB port. If your keyboard is
# BLE-only, omit this — bit 5 will always read 0 (Bluetooth).
CONFIG_ZMK_USB=y

# ── Named layer support (layer_name field in payload) ─────────────────────────
# Requires a ZMK build from 2024+ that exposes zmk_keymap_layer_name().
# Set to n on older trees; the layer name field will fall back to "L<n>".
CONFIG_ZMK_BLE_ADV_LAYER_NAMES=y

# ── Optional tuning (shown with their defaults) ───────────────────────────────
CONFIG_ZMK_BLE_ADV_INTERVAL_MS=200         
CONFIG_ZMK_BLE_ADV_WPM_WINDOW_SECONDS=10