CONFIG_SPI=y

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610_INO=y
CONFIG_PMW3610_INO_CPI=1800
CONFIG_PMW3610_INO_CPI_DIVIDOR=3
CONFIG_PMW3610_INO_ORIENTATION_90=y
CONFIG_PMW3610_INO_SNIPE_CPI=3100
CONFIG_PMW3610_INO_SNIPE_CPI_DIVIDOR=10
CONFIG_PMW3610_INO_SCROLL_TICK=70
CONFIG_PMW3610_INO_INVERT_X=y

CONFIG_PMW3610_INO_POLLING_RATE_125_SW=y
CONFIG_PMW3610_INO_SMART_ALGORITHM=y


# CONFIG_PMW3610_INO_AUTOMOUSE_TIMEOUT_MS=250


CONFIG_ZMK_KEYBOARD_NAME="Charybda"


# ── Optional features that fill in more payload fields ──────
CONFIG_ZMK_WPM=y               
CONFIG_ZMK_BLE_ADV_WPM_WINDOW_SECONDS=10


CONFIG_ZMK_BLE_ADV=y
CONFIG_ZMK_HID_INDICATORS=y

# ── BLE & heap sizing ────────────────────────────────────────
# ZMK's BLE notify thread — default 768 B, increased for split
# keyboard + trackball concurrent BLE activity.
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048
 
# System heap — default 8192 B, doubled to reduce allocation
# pressure which can cause silent crashes on the nRF52840.
CONFIG_HEAP_MEM_POOL_SIZE=16384