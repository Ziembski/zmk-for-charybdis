CONFIG_SPI=y

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610_INO=y
CONFIG_PMW3610_INO_CPI=1800
CONFIG_PMW3610_INO_CPI_DIVIDOR=3
CONFIG_PMW3610_INO_ORIENTATION_90=y
CONFIG_PMW3610_INO_SNIPE_CPI=3100
CONFIG_PMW3610_INO_SNIPE_CPI_DIVIDOR=10
CONFIG_PMW3610_INO_SCROLL_TICK=70
CONFIG_PMW3610_INO_INVERT_X=y

CONFIG_PMW3610_INO_POLLING_RATE_125_SW=y
CONFIG_PMW3610_INO_SMART_ALGORITHM=y


# CONFIG_PMW3610_INO_AUTOMOUSE_TIMEOUT_MS=250




# ── Optional features that fill in more payload fields ──────
CONFIG_ZMK_WPM=y               
CONFIG_ZMK_BLE_ADV_WPM_WINDOW_SECONDS=10


CONFIG_ZMK_BLE_ADV=y
CONFIG_ZMK_HID_INDICATORS=y

# ── USB Logging (CDC-ACM) ────────────────────────────────────
# Connect via: screen /dev/ttyACM0 115200  (Linux)
#              screen /dev/tty.usbmodem*   (macOS)
#              PuTTY or TeraTerm on COMx   (Windows)
CONFIG_ZMK_USB_LOGGING=y
 
# Give the log ring-buffer enough room so messages aren't
# silently dropped during bursts (BLE events, boot).
CONFIG_LOG_BUFFER_SIZE=8192
 
# How often the log-processing thread flushes to USB (ms).
# Lower = lower latency; 25 ms is a good balance.
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=25
 
# ── Memory / stack diagnostics ───────────────────────────────
# Required for sys_heap_runtime_stats_get().
CONFIG_SYS_HEAP_RUNTIME_STATS=y
 
# Required for k_thread_foreach() + k_thread_stack_space_get().
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
 
# Pre-fill stacks with 0xAA so unused bytes are measurable.
CONFIG_INIT_STACKS=y
 
# Lets k_thread_stack_space_get() walk the fill pattern.
CONFIG_STACK_USAGE=y
